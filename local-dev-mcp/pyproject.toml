[project]
name = "local-dev-mcp"
version = "0.1.0"
description = "A local MCP server that gives Notion AI (or any MCP client) Claude Code-style access to the local machine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0"]

[project.optional-dependencies]
extras = [
    "psutil>=5.9",
    "pyautogui>=0.9.54",
    "mss>=9.0",
    "pyperclip>=1.8",
]
dev = ["pytest>=7.0"]

[project.scripts]
local-dev-mcp = "server:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
py-modules = ["server", "config"]
packages = ["tools", "utils"]
